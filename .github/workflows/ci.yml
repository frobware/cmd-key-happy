name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push supersedes whatever is already running for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and assemble
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Everything this job does lives in the ci target, so it can be
      # run before pushing. No local.mk here, so CODESIGN_IDENTITY
      # falls back to ad-hoc, which is what a fresh checkout gets, and
      # the sudo-derivation check has a local.mk of its own to write.
      - name: Build, test and assemble
        run: make ci
